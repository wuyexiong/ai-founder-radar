name: CI Quality Gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - "progress/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - "progress/**"
  workflow_dispatch:

jobs:
  quality-gate:
    name: Typecheck, Offline Tests & Next.js Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      DATABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run offline unit & integration tests with coverage
        run: npm run test:coverage

      - name: Verify production Next.js build (offline fallback mode)
        run: npm run build
