name: CI Quality Gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - "progress/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - "progress/**"
  workflow_dispatch:

jobs:
  quality-gate:
    name: Typecheck, Offline Tests & Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      DATABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run offline unit & integration tests with coverage
        run: npm run test:coverage

      - name: Verify production Next.js build (offline fallback mode)
        run: npm run build
