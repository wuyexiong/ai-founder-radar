name: Daily AI Founder Radar Sync

permissions:
  contents: read

concurrency:
  group: daily-radar-sync
  cancel-in-progress: false

on:
  schedule:
    # 主调度：每天 UTC 23:23（北京时间 07:23，错开整点及 5 分钟倍数队列高峰），同时自动保活 Supabase 免费库
    - cron: "23 23 * * *"
    # 兜底防丢包调度：每天 UTC 00:17（北京时间 08:17），若今日已完成同步则秒退（0 LLM 消耗），防范 GitHub 静默丢弃主 cron
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  sync-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Multi-Source Fetch & AI Distillation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: "https://radar.aibuildon.com"
          SKIP_IF_TODAY_SYNCED: ${{ github.event_name == 'schedule' && github.event.schedule == '17 0 * * *' && 'true' || 'false' }}
        run: npm run radar:sync
