name: Daily AI Founder Radar Sync

permissions:
  contents: read

concurrency:
  group: daily-radar-sync
  cancel-in-progress: false

on:
  schedule:
    # 对齐成熟开源实践（yetone/magpie 同款单条奇数分钟每小时轻量对账，保护 Gemini 额度 0 额外消耗）：
    # - 北京时间 07:23（UTC 23:23）：放行早盘主采集与四语种提炼（每日第 1 次）；
    # - 北京时间 08:23 / 09:23 / 10:23：Checkout 前 0.5s 检查线上 llms.txt 是否已含今日归档，已就绪则直接秒退（不拉代码、不启 Node、0 Token），仅在早盘漏跑时自动自愈补跑；
    # - 美西时间 23:23 PT（夏令时 14:23 BJT / 冬令时 15:23 BJT）：放行美西深夜收官增量补采（每日第 2 次，自动排除今日已入库 URL 与 App Store 静态榜）；
    # - 其余所有小时（00~06 点、11~23 点非美西 23 PT）：0.01s 直接静默跳过。
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  sync-signals:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Reconcile daily sync window & quota-safe gate
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          SITE_URL: "https://radar.aibuildon.com"
        run: |
          set -euo pipefail
          BJT_DATE=$(TZ="Asia/Shanghai" date +%Y-%m-%d)
          BJT_HOUR=$(TZ="Asia/Shanghai" date +%-H)
          PT_HOUR=$(TZ="America/Los_Angeles" date +%-H)
          PT_OFFSET=$(TZ="America/Los_Angeles" date +%z)
          echo "Event=${EVENT_NAME}, Schedule=${SCHEDULE_EXPR:-manual}, BJT=${BJT_DATE} ${BJT_HOUR}:00, America/Los_Angeles=${PT_HOUR}:00 (${PT_OFFSET})"

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "▶️ 手动/API 触发 (${EVENT_NAME})，放行执行同步。"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "skip_if_synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BJT_HOUR" -eq 7 ]; then
            echo "🌅 命中早盘主发刊窗口 (BJT 07:23)，放行执行同步。"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "skip_if_synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PT_HOUR" -eq 23 ]; then
            echo "🌙 命中美西深夜收官增量补采窗口 (23:23 PT, ${PT_OFFSET})，放行增量同步。"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "skip_if_synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BJT_HOUR" -eq 8 ] || [ "$BJT_HOUR" -eq 9 ] || [ "$BJT_HOUR" -eq 10 ]; then
            if BODY=$(curl -fsS --retry 2 --max-time 10 "${SITE_URL}/llms.txt" 2>/dev/null) && printf '%s' "$BODY" | grep -qF "daily/${BJT_DATE}"; then
              echo "✅ 线上站点 (${SITE_URL}/llms.txt) 已包含今日 (${BJT_DATE}) 归档，0 克隆 / 0 Token 秒退。"
              echo "run_sync=false" >> "$GITHUB_OUTPUT"
              echo "skip_if_synced=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "🔄 巡检发现线上尚未就绪今日 (${BJT_DATE}) 归档，自动触发自愈兜底补跑（开启数据库幂等锁保护）！"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "skip_if_synced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⏭️ 当前处于非发刊静默窗口 (BJT ${BJT_HOUR}:00, PT ${PT_HOUR}:00)，0 消耗直接跳过。"
          echo "run_sync=false" >> "$GITHUB_OUTPUT"
          echo "skip_if_synced=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.schedule_gate.outputs.run_sync == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: steps.schedule_gate.outputs.run_sync == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run_sync == 'true'
        run: npm ci

      - name: Run Multi-Source Fetch & AI Distillation
        if: steps.schedule_gate.outputs.run_sync == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: "https://radar.aibuildon.com"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SCHEDULE_CRON: ${{ github.event.schedule }}
          GITHUB_GATE_APPROVED: ${{ steps.schedule_gate.outputs.run_sync }}
          SKIP_IF_TODAY_SYNCED: ${{ steps.schedule_gate.outputs.skip_if_synced }}
        run: npm run radar:sync
